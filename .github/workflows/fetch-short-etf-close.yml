name: Update Short ETF Close Prices

on:
  schedule:
    # 미국 동부 정규장 마감(16:00 EST) 후 약 2시간 뒤 실행
    # EST = UTC-5 → 16:00 EST = 21:00 UTC → 여유 두고 22:00 UTC
    - cron: '0 22 * * 1-5'   # 월~금 22:00 UTC (한국시간 다음날 07:00 KST)

  # 수동 실행 (Actions 탭 → Run workflow)
  workflow_dispatch:
    inputs:
      force_date:
        description: '기준일 오버라이드 (YYYY-MM-DD, 비워두면 자동)'
        required: false
        default: ''

jobs:
  fetch-short-etf:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # JSON 파일 커밋 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch short ETF close prices
        env:
          FORCE_DATE: ${{ github.event.inputs.force_date }}
        run: python scripts/fetch_short_etf.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/short-etf-data.json
          git diff --cached --quiet || git commit -m "chore: update short ETF close prices $(date -u +%Y-%m-%d)"
          git push
